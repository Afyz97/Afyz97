<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 168" width="880" height="168" role="img" aria-label="Show what I can build, not who I built it for">
  <title>Footer: show what I can build, not who I built it for</title>
  <defs>
    <linearGradient id="fg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="35%" stop-color="#38BDF8"/>
      <stop offset="70%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fsweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0"/>
      <stop offset="50%" stop-color="#A78BFA" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="fclip"><rect x="1" y="1" width="878" height="166" rx="12"/></clipPath>
  </defs>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .caret { animation: blink 1.05s steps(1) infinite; }
    @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
    .sweep { animation: sweep 9s linear infinite; }
    @keyframes sweep { from { transform: translateX(-280px) } to { transform: translateX(1160px) } }
  </style>

  <rect x="1" y="1" width="878" height="166" rx="12" fill="#0B0F14" stroke="#1E2A36"/>
  <g clip-path="url(#fclip)">
    <rect class="sweep" x="0" y="1" width="280" height="166" fill="url(#fsweep)"/>
    <rect x="24" y="28" width="832" height="2" fill="url(#fg)"/>

    <text class="sans" x="440" y="76" font-size="20" font-weight="700" fill="#E6EDF3" text-anchor="middle">Show what I can build, not who I built it for.</text>
    <text class="mono" x="440" y="102" font-size="11.5" fill="#5C7183" text-anchor="middle" letter-spacing="1.6">CAPABILITY OVER CLIENT IDENTITY · ARCHITECTURE OVER NAMES</text>

    <g class="mono" font-size="10.5" letter-spacing="1.2">
      <g>
        <rect x="238" y="120" width="118" height="22" rx="11" fill="#101821" stroke="#22303D"/>
        <text x="297" y="135" fill="#9FB3C8" text-anchor="middle">SYSTEM DESIGN</text>
      </g>
      <g>
        <rect x="366" y="120" width="106" height="22" rx="11" fill="#101821" stroke="#22303D"/>
        <text x="419" y="135" fill="#9FB3C8" text-anchor="middle">AUTOMATION</text>
      </g>
      <g>
        <rect x="482" y="120" width="160" height="22" rx="11" fill="#101821" stroke="#22303D"/>
        <text x="562" y="135" fill="#9FB3C8" text-anchor="middle">CONFIDENTIALITY</text>
      </g>
    </g>

    <text class="mono" x="24" y="158" font-size="10.5" fill="#33465A">amir-os $ </text>
    <rect class="caret" x="92" y="148" width="7" height="12" fill="#38BDF8"/>
    <text class="mono" x="856" y="158" font-size="10.5" fill="#33465A" text-anchor="end">session persists</text>
  </g>
</svg>
