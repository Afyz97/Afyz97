<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 262" width="880" height="262" role="img" aria-label="whoami: full-stack engineer building enterprise web systems, commerce, AI engineering and governance tooling">
  <title>whoami: identity card</title>
  <defs>
    <linearGradient id="wg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
  </defs>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 13px; }
    .l { opacity: 0; animation: in .3s ease-out forwards; }
    @keyframes in { to { opacity: 1 } }
    .d1{animation-delay:.25s} .d2{animation-delay:.45s} .d3{animation-delay:.65s}
    .d4{animation-delay:.85s} .d5{animation-delay:1.05s} .d6{animation-delay:1.25s}
    .caret { animation: blink 1.05s steps(1) infinite; }
    @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
    .type { animation: type 1.1s steps(18) forwards; }
    @keyframes type { from { width: 0 } to { width: 210px } }
  </style>

  <rect x="1" y="1" width="878" height="260" rx="12" fill="#0B0F14" stroke="#1E2A36"/>
  <rect x="1" y="1" width="878" height="32" fill="#0E141B"/>
  <line x1="1" y1="33" x2="879" y2="33" stroke="#1E2A36"/>
  <circle cx="22" cy="17" r="5" fill="#FF5F57"/>
  <circle cx="40" cy="17" r="5" fill="#FEBC2E"/>
  <circle cx="58" cy="17" r="5" fill="#28C840"/>
  <text class="mono" x="82" y="21" font-size="11.5" fill="#5C7183">whoami · identity</text>
  <rect x="1" y="33" width="4" height="228" fill="url(#wg)"/>

  <g class="mono">
    <text x="28" y="66" fill="#8FA5B8">$ <tspan fill="#E6EDF3">whoami --profile --verbose</tspan></text>
    <g class="l d1"><text x="28" y="98" fill="#5C7183">  name        <tspan fill="#E6EDF3">Amir Nadzim</tspan></text></g>
    <g class="l d2"><text x="28" y="124" fill="#5C7183">  role        <tspan fill="#E6EDF3">Full-Stack Engineer · Systems Designer</tspan></text></g>
    <g class="l d3"><text x="28" y="150" fill="#5C7183">  domains     <tspan fill="#7DD3FC">enterprise-web</tspan>  <tspan fill="#7DD3FC">commerce</tspan>  <tspan fill="#C4B5FD">ai-engineering</tspan>  <tspan fill="#FCD34D">governance</tspan></text></g>
    <g class="l d4"><text x="28" y="176" fill="#5C7183">  interfaces  <tspan fill="#E6EDF3">public web · member portal · PWA · admin console</tspan></text></g>
    <g class="l d5"><text x="28" y="202" fill="#5C7183">  approach    <tspan fill="#E6EDF3">modular architecture · RBAC · automation · auditability</tspan></text></g>
    <g class="l d6">
      <text x="28" y="236" fill="#8FA5B8">$ </text>
      <rect class="caret" x="44" y="225" width="8" height="14" fill="#38BDF8"/>
    </g>
  </g>
</svg>
