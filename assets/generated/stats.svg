<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 165" width="420" height="165" role="img" aria-label="Public GitHub activity totals">
  <title>GitHub stats</title>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
  </style>
  <rect x="1" y="1" width="418" height="163" rx="12" fill="#0B0F14" stroke="#1E2A36"/>
  <text class="mono" x="20" y="30" font-size="12.5" fill="#38BDF8" letter-spacing="1.5">GITHUB STATS</text>
  <text class="mono" x="400" y="30" font-size="10" fill="#33465A" text-anchor="end">2026-08-30</text>
  <text class="mono" x="20" y="48" font-size="10" fill="#3F5464">public activity · private repos never enumerated</text>
  <line x1="20" y1="60" x2="400" y2="60" stroke="#1E2A36"/>
  <g>
      <circle cx="24" cy="76" r="4" fill="#38BDF8"/>
      <text class="mono" x="36" y="80" font-size="11" fill="#8FA5B8">commits</text>
      <text class="mono" x="196" y="80" font-size="12.5" fill="#E6EDF3" text-anchor="end">41</text>
    </g>
    <g>
      <circle cx="224" cy="76" r="4" fill="#FBBF24"/>
      <text class="mono" x="236" y="80" font-size="11" fill="#8FA5B8">stars earned</text>
      <text class="mono" x="396" y="80" font-size="12.5" fill="#E6EDF3" text-anchor="end">0</text>
    </g>
    <g>
      <circle cx="24" cy="102" r="4" fill="#A78BFA"/>
      <text class="mono" x="36" y="106" font-size="11" fill="#8FA5B8">pull requests</text>
      <text class="mono" x="196" y="106" font-size="12.5" fill="#E6EDF3" text-anchor="end">0</text>
    </g>
    <g>
      <circle cx="224" cy="102" r="4" fill="#34D399"/>
      <text class="mono" x="236" y="106" font-size="11" fill="#8FA5B8">issues</text>
      <text class="mono" x="396" y="106" font-size="12.5" fill="#E6EDF3" text-anchor="end">0</text>
    </g>
    <g>
      <circle cx="24" cy="128" r="4" fill="#818CF8"/>
      <text class="mono" x="36" y="132" font-size="11" fill="#8FA5B8">public repos</text>
      <text class="mono" x="196" y="132" font-size="12.5" fill="#E6EDF3" text-anchor="end">11</text>
    </g>
    <g>
      <circle cx="224" cy="128" r="4" fill="#5C7183"/>
      <text class="mono" x="236" y="132" font-size="11" fill="#8FA5B8">followers</text>
      <text class="mono" x="396" y="132" font-size="12.5" fill="#E6EDF3" text-anchor="end">2</text>
    </g>
</svg>
