<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 165" width="420" height="165" role="img" aria-label="Top languages across public repositories">
  <title>Top languages</title>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
