<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 180" width="880" height="180" role="img" aria-label="Contribution snake placeholder: generated on the first workflow run">
  <title>Contribution snake: pending first workflow run</title>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .dot { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: .25 } 50% { opacity: 1 } }
  </style>
  <rect x="1" y="1" width="878" height="178" rx="12" fill="#0B0F14" stroke="#1E2A36"/>
  <g fill="#16202B">
    <rect x="40" y="52" width="12" height="12" rx="2.5"/><rect x="58" y="52" width="12" height="12" rx="2.5"/>
    <rect x="76" y="52" width="12" height="12" rx="2.5"/><rect x="94" y="52" width="12" height="12" rx="2.5"/>
    <rect x="40" y="70" width="12" height="12" rx="2.5"/><rect x="58" y="70" width="12" height="12" rx="2.5"/>
    <rect x="76" y="70" width="12" height="12" rx="2.5"/><rect x="94" y="70" width="12" height="12" rx="2.5"/>
    <rect x="40" y="88" width="12" height="12" rx="2.5"/><rect x="58" y="88" width="12" height="12" rx="2.5"/>
    <rect x="76" y="88" width="12" height="12" rx="2.5"/><rect x="94" y="88" width="12" height="12" rx="2.5"/>
  </g>
  <circle class="dot" cx="46" cy="58" r="4" fill="#38BDF8"/>
  <circle class="dot" cx="82" cy="76" r="4" fill="#38BDF8" style="animation-delay:.6s"/>
  <circle class="dot" cx="64" cy="94" r="4" fill="#38BDF8" style="animation-delay:1.2s"/>
  <text class="mono" x="140" y="72" font-size="13" fill="#E6EDF3">contribution snake</text>
  <text class="mono" x="140" y="94" font-size="11" fill="#5C7183">placeholder: replaced automatically on the first contribution-snake workflow run</text>
  <text class="mono" x="140" y="128" font-size="10.5" fill="#33465A">Actions ▸ contribution-snake ▸ Run workflow</text>
</svg>
