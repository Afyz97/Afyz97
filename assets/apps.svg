    <linearGradient id="ic1" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0EA5E9" stop-opacity=".22"/><stop offset="100%" stop-color="#38BDF8" stop-opacity=".06"/></linearGradient>
    <linearGradient id="ic2" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#34D399" stop-opacity=".22"/><stop offset="100%" stop-color="#34D399" stop-opacity=".06"/></linearGradient>
    <linearGradient id="ic3" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#A78BFA" stop-opacity=".24"/><stop offset="100%" stop-color="#A78BFA" stop-opacity=".06"/></linearGradient>
    <linearGradient id="ic4" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#F472B6" stop-opacity=".22"/><stop offset="100%" stop-color="#F472B6" stop-opacity=".06"/></linearGradient>
    <linearGradient id="ic5" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#FBBF24" stop-opacity=".22"/><stop offset="100%" stop-color="#FBBF24" stop-opacity=".06"/></linearGradient>
