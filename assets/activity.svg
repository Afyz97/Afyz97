<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 276" width="880" height="276" role="img" aria-label="Focus allocation: enterprise systems, AI engineering, commerce and payments, PWA interfaces, governance and ISMS">
  <title>Activity monitor: focus allocation (self-reported)</title>
  <defs>
    <linearGradient id="mg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .r { opacity: 0; animation: in .3s ease-out forwards; }
    @keyframes in { to { opacity: 1 } }
    .r1{animation-delay:.10s} .r2{animation-delay:.22s} .r3{animation-delay:.34s} .r4{animation-delay:.46s} .r5{animation-delay:.58s}
  </style>

  <rect x="1" y="1" width="878" height="274" rx="12" fill="#0B0F14" stroke="#1E2A36"/>
  <rect x="1" y="1" width="878" height="32" fill="#0E141B"/>
  <line x1="1" y1="33" x2="879" y2="33" stroke="#1E2A36"/>
  <circle cx="22" cy="17" r="5" fill="#FF5F57"/>
  <circle cx="40" cy="17" r="5" fill="#FEBC2E"/>
  <circle cx="58" cy="17" r="5" fill="#28C840"/>
  <text class="mono" x="82" y="21" font-size="11.5" fill="#5C7183">monitor · running processes</text>

  <text class="mono" x="24" y="58" font-size="11" fill="#4E6376" letter-spacing="3">FOCUS ALLOCATION</text>
  <rect x="176" y="53" width="680" height="1" fill="url(#mg)"/>

  <g class="mono" font-size="10.5" fill="#4E6376">
    <text x="24" y="82">PID</text>
    <text x="88" y="82">PROCESS</text>
    <text x="330" y="82">DOMAIN</text>
    <text x="600" y="82">ALLOCATION</text>
    <text x="856" y="82" text-anchor="end">SHARE</text>
  </g>
  <line x1="24" y1="90" x2="856" y2="90" stroke="#16202B"/>

  <g class="mono" font-size="12">
    <g class="r r1">
      <text x="24" y="115" fill="#4E6376">0x01</text>
      <text x="88" y="115" fill="#E6EDF3">enterprise-systems</text>
      <text x="330" y="115" fill="#7D8FA3">laravel · modular monolith</text>
      <rect x="600" y="106" width="216" height="7" rx="3.5" fill="#16202B"/>
      <rect x="600" y="106" width="0" height="7" rx="3.5" fill="#38BDF8"><animate attributeName="width" from="0" to="184" dur="1.1s" begin=".2s" fill="freeze"/></rect>
      <text x="856" y="115" fill="#8FA5B8" text-anchor="end">35%</text>
    </g>
    <g class="r r2">
      <text x="24" y="147" fill="#4E6376">0x02</text>
      <text x="88" y="147" fill="#E6EDF3">ai-engineering</text>
      <text x="330" y="147" fill="#7D8FA3">agents · orchestration</text>
      <rect x="600" y="138" width="216" height="7" rx="3.5" fill="#16202B"/>
      <rect x="600" y="138" width="0" height="7" rx="3.5" fill="#A78BFA"><animate attributeName="width" from="0" to="130" dur="1.1s" begin=".3s" fill="freeze"/></rect>
      <text x="856" y="147" fill="#8FA5B8" text-anchor="end">25%</text>
    </g>
    <g class="r r3">
      <text x="24" y="179" fill="#4E6376">0x03</text>
      <text x="88" y="179" fill="#E6EDF3">commerce-payments</text>
      <text x="330" y="179" fill="#7D8FA3">storefront · POS · gateways</text>
      <rect x="600" y="170" width="216" height="7" rx="3.5" fill="#16202B"/>
      <rect x="600" y="170" width="0" height="7" rx="3.5" fill="#34D399"><animate attributeName="width" from="0" to="78" dur="1.1s" begin=".4s" fill="freeze"/></rect>
      <text x="856" y="179" fill="#8FA5B8" text-anchor="end">15%</text>
    </g>
    <g class="r r4">
      <text x="24" y="211" fill="#4E6376">0x04</text>
      <text x="88" y="211" fill="#E6EDF3">pwa-interfaces</text>
      <text x="330" y="211" fill="#7D8FA3">portal · offline-aware UI</text>
      <rect x="600" y="202" width="216" height="7" rx="3.5" fill="#16202B"/>
      <rect x="600" y="202" width="0" height="7" rx="3.5" fill="#818CF8"><animate attributeName="width" from="0" to="78" dur="1.1s" begin=".5s" fill="freeze"/></rect>
      <text x="856" y="211" fill="#8FA5B8" text-anchor="end">15%</text>
    </g>
    <g class="r r5">
      <text x="24" y="243" fill="#4E6376">0x05</text>
      <text x="88" y="243" fill="#E6EDF3">governance-isms</text>
      <text x="330" y="243" fill="#7D8FA3">controls · audit · risk</text>
      <rect x="600" y="234" width="216" height="7" rx="3.5" fill="#16202B"/>
      <rect x="600" y="234" width="0" height="7" rx="3.5" fill="#FBBF24"><animate attributeName="width" from="0" to="52" dur="1.1s" begin=".6s" fill="freeze"/></rect>
      <text x="856" y="243" fill="#8FA5B8" text-anchor="end">10%</text>
    </g>
  </g>

  <text class="mono" x="24" y="266" font-size="10.5" fill="#3F5464">self-declared focus split · not live telemetry · live contribution data appears in the panels below</text>
</svg>
