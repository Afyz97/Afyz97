<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 408" width="880" height="408" role="img" aria-label="Installed stack grouped into backend, frontend, database, AI engineering, infrastructure and governance">
  <title>Installed stack — package manager view</title>
  <defs>
    <linearGradient id="sg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .l { opacity: 0; animation: in .26s ease-out forwards; }
    @keyframes in { to { opacity: 1 } }
    .caret { animation: blink 1.05s steps(1) infinite; }
    @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
    .g1{animation-delay:.10s} .g2{animation-delay:.26s} .g3{animation-delay:.42s}
    .g4{animation-delay:.18s} .g5{animation-delay:.34s} .g6{animation-delay:.50s}
    .g7{animation-delay:.70s}
  </style>

  <rect x="1" y="1" width="878" height="406" rx="12" fill="#0B0F14" stroke="#1E2A36"/>
  <rect x="1" y="1" width="878" height="32" fill="#0E141B"/>
  <line x1="1" y1="33" x2="879" y2="33" stroke="#1E2A36"/>
  <circle cx="22" cy="17" r="5" fill="#FF5F57"/>
  <circle cx="40" cy="17" r="5" fill="#FEBC2E"/>
  <circle cx="58" cy="17" r="5" fill="#28C840"/>
  <text class="mono" x="82" y="21" font-size="11.5" fill="#5C7183">pkg — installed modules</text>

  <text class="mono" x="28" y="60" font-size="12.5" fill="#8FA5B8">$ <tspan fill="#E6EDF3">sys pkg list --installed --grouped</tspan></text>
  <rect x="330" y="55" width="522" height="1" fill="url(#sg)"/>

  <g class="mono">
    <g class="l g1">
      <circle cx="34" cy="88" r="4" fill="#38BDF8"/>
      <text x="48" y="92" font-size="12" fill="#38BDF8" letter-spacing="2.2">BACKEND</text>
      <text x="30" y="116" font-size="12.5" fill="#C9D6E2">  Laravel</text>
      <text x="404" y="116" font-size="10.5" fill="#4E6376" text-anchor="end">[core]</text>
      <text x="30" y="138" font-size="12.5" fill="#C9D6E2">  PHP · modular monolith</text>
      <text x="404" y="138" font-size="10.5" fill="#4E6376" text-anchor="end">[core]</text>
      <text x="30" y="160" font-size="12.5" fill="#C9D6E2">  REST APIs · queues · jobs</text>
      <text x="404" y="160" font-size="10.5" fill="#4E6376" text-anchor="end">[core]</text>
    </g>
    <g class="l g2">
      <circle cx="34" cy="188" r="4" fill="#A78BFA"/>
      <text x="48" y="192" font-size="12" fill="#A78BFA" letter-spacing="2.2">FRONTEND</text>
      <text x="30" y="216" font-size="12.5" fill="#C9D6E2">  Blade · Livewire</text>
      <text x="404" y="216" font-size="10.5" fill="#4E6376" text-anchor="end">[ui]</text>
      <text x="30" y="238" font-size="12.5" fill="#C9D6E2">  Bootstrap · Tailwind</text>
      <text x="404" y="238" font-size="10.5" fill="#4E6376" text-anchor="end">[ui]</text>
      <text x="30" y="260" font-size="12.5" fill="#C9D6E2">  Progressive Web App</text>
      <text x="404" y="260" font-size="10.5" fill="#4E6376" text-anchor="end">[ui]</text>
    </g>
    <g class="l g3">
      <circle cx="34" cy="288" r="4" fill="#34D399"/>
      <text x="48" y="292" font-size="12" fill="#34D399" letter-spacing="2.2">DATABASE</text>
      <text x="30" y="316" font-size="12.5" fill="#C9D6E2">  MySQL · MariaDB</text>
      <text x="404" y="316" font-size="10.5" fill="#4E6376" text-anchor="end">[data]</text>
      <text x="30" y="338" font-size="12.5" fill="#C9D6E2">  Redis · cache · sessions</text>
      <text x="404" y="338" font-size="10.5" fill="#4E6376" text-anchor="end">[data]</text>
      <text x="30" y="360" font-size="12.5" fill="#C9D6E2">  Schema · migrations · seeding</text>
      <text x="404" y="360" font-size="10.5" fill="#4E6376" text-anchor="end">[data]</text>
    </g>

    <line x1="440" y1="76" x2="440" y2="372" stroke="#16202B"/>

    <g class="l g4">
      <circle cx="474" cy="88" r="4" fill="#818CF8"/>
      <text x="488" y="92" font-size="12" fill="#818CF8" letter-spacing="2.2">AI ENGINEERING</text>
      <text x="470" y="116" font-size="12.5" fill="#C9D6E2">  Agent orchestration</text>
      <text x="852" y="116" font-size="10.5" fill="#4E6376" text-anchor="end">[ai]</text>
      <text x="470" y="138" font-size="12.5" fill="#C9D6E2">  Skills · plugins · MCP</text>
      <text x="852" y="138" font-size="10.5" fill="#4E6376" text-anchor="end">[ai]</text>
      <text x="470" y="160" font-size="12.5" fill="#C9D6E2">  Workflow · context design</text>
      <text x="852" y="160" font-size="10.5" fill="#4E6376" text-anchor="end">[ai]</text>
    </g>
    <g class="l g5">
      <circle cx="474" cy="188" r="4" fill="#38BDF8"/>
      <text x="488" y="192" font-size="12" fill="#38BDF8" letter-spacing="2.2">INFRASTRUCTURE</text>
      <text x="470" y="216" font-size="12.5" fill="#C9D6E2">  Git · CI/CD workflows</text>
      <text x="852" y="216" font-size="10.5" fill="#4E6376" text-anchor="end">[infra]</text>
      <text x="470" y="238" font-size="12.5" fill="#C9D6E2">  Composer · npm · Vite</text>
      <text x="852" y="238" font-size="10.5" fill="#4E6376" text-anchor="end">[infra]</text>
      <text x="470" y="260" font-size="12.5" fill="#C9D6E2">  Schedulers · background workers</text>
      <text x="852" y="260" font-size="10.5" fill="#4E6376" text-anchor="end">[infra]</text>
    </g>
    <g class="l g6">
      <circle cx="474" cy="288" r="4" fill="#FBBF24"/>
      <text x="488" y="292" font-size="12" fill="#FBBF24" letter-spacing="2.2">GOVERNANCE</text>
      <text x="470" y="316" font-size="12.5" fill="#C9D6E2">  RBAC · permissions</text>
      <text x="852" y="316" font-size="10.5" fill="#4E6376" text-anchor="end">[gov]</text>
      <text x="470" y="338" font-size="12.5" fill="#C9D6E2">  Audit logging · traceability</text>
      <text x="852" y="338" font-size="10.5" fill="#4E6376" text-anchor="end">[gov]</text>
      <text x="470" y="360" font-size="12.5" fill="#C9D6E2">  ISMS documentation · risk</text>
      <text x="852" y="360" font-size="10.5" fill="#4E6376" text-anchor="end">[gov]</text>
    </g>

    <g class="l g7">
      <text x="28" y="390" font-size="12" fill="#5C7183">18 modules resolved · <tspan fill="#34D399">0 conflicts</tspan> · $</text>
      <rect class="caret" x="322" y="379" width="8" height="13" fill="#38BDF8"/>
    </g>
  </g>
</svg>
