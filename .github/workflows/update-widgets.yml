name: update-widgets

# Regenerates assets/generated/focus.svg from data/profile.json and
# assets/generated/langs.svg from the public GitHub API.
# Edit the JSON, push, and the widget follows.

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "scripts/build-widgets.mjs"
      - ".github/workflows/update-widgets.yml"
  schedule:
    - cron: "17 3 * * *" # daily, keeps the language split current
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-widgets
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Self-check the generator
        run: node scripts/build-widgets.mjs --selftest

      - name: Build widgets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/build-widgets.mjs

      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain assets/generated)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/generated
            git commit -m "chore: regenerate profile widgets"
            git push
          else
            echo "no widget changes"
          fi
